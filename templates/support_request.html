<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Apache Support</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f6f6;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f6;padding:24px 12px;">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6e6e6;">
            <tr>
              <td style="padding:18px 20px;background:#765276;color:#ffffff;">
                <div style="font-size:16px;font-weight:700;">Aura Apache Parking</div>
                <div style="font-size:13px;opacity:0.9;">Support request</div>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 20px;color:#252220;">
                <div style="font-size:14px;line-height:1.5;">
                  <p style="margin:0 0 8px;"><strong>From:</strong> {{user_email}} ({{role}})</p>
                  <p style="margin:0 0 8px;"><strong>Subject:</strong> {{subject}}</p>
                  <p style="margin:0 0 8px;"><strong>Message:</strong></p>
                  <div style="white-space:pre-wrap;background:#f6f6f6;border:1px solid #e6e6e6;border-radius:10px;padding:12px;">{{message}}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 20px;color:#9BA4B3;font-size:12px;">
                Reply to this email to respond directly.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
