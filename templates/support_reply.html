<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Support Ticket Update</title>
  <style>
    body{margin:0;background:#252220;padding:24px 12px;font-family:Arial,sans-serif;}
    table{border-spacing:0;border-collapse:collapse;width:100%;max-width:600px;margin:0 auto;}
    .hero{background-image:linear-gradient(135deg, rgba(118,82,118,0.92) 0%, rgba(138,98,133,0.86) 100%), url('{{heroImage}}');background-size:cover;background-position:center;padding:44px 24px;text-align:center;color:#fff;border-radius:12px 12px 0 0;}
    .hero p{color:#fff;}
    .body{background:#fff;padding:34px 24px;text-align:center;border-radius:0 0 12px 12px;}
    .label{color:#765276;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px;text-align:left;}
    .reply{background:#f8f9fa;border:1px solid #e9ecef;border-radius:12px;padding:16px;text-align:left;color:#252220;white-space:pre-wrap;}
    .btn{display:inline-block;background:#765276;color:#ffffff !important;text-decoration:none;padding:14px 28px;border-radius:10px;font-weight:700;}
    .muted{color:#9BA4B3;font-size:12px;line-height:1.5;}
    h1{margin:0;font-size:28px;letter-spacing:2px;}
    h2{margin:0 0 10px;color:#252220;}
    p{margin:0 0 12px;color:#555;line-height:1.6;}
  </style>
</head>
<body>
  <table role="presentation">
    <tr><td class="hero"><h1>AURA APACHE</h1><p style="margin:8px 0 0;opacity:0.9;">Support</p></td></tr>
    <tr>
      <td class="body">
        <h2>Ticket Update</h2>
        <p>Your support ticket <strong>#{{ticket_id}}</strong> has a new response.</p>

        <span class="label">Response</span>
        <div class="reply">{{support_reply}}</div>

        <div style="height:18px;"></div>
        <a class="btn" href="{{action_url}}">View Full Ticket</a>
        <p class="muted" style="margin-top:18px;">If the button doesn’t work, paste this link into your browser: {{action_url}}</p>
      </td>
    </tr>
    <tr><td class="muted" style="text-align:center;padding:18px 8px;">Aura Apache Parking</td></tr>
  </table>
</body>
</html>
